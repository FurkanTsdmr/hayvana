<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🐾 Hayvan Savaşı - Online</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        body { background: #1a2f1a; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 15px; color: #fff; }
        .container { max-width: 950px; width: 100%; background: rgba(0,0,0,0.85); border-radius: 30px; padding: 20px; border: 2px solid #c9a84b; }
        h1 { text-align: center; color: #f7d875; font-size: 1.8rem; margin-bottom: 12px; }
        
        .lobby { background: #1d3223; border-radius: 20px; padding: 15px; text-align: center; border: 2px solid #7a945a; margin-bottom: 15px; }
        .lobby input { padding: 12px 18px; border-radius: 25px; border: 2px solid #b9a06b; font-size: 1rem; width: 160px; text-align: center; background: #0e1e14; color: #f7d875; }
        .lobby button { padding: 12px 22px; border-radius: 25px; border: none; font-weight: bold; font-size: 0.95rem; cursor: pointer; background: #f7d875; color: #1e2c1a; margin: 5px; transition: 0.3s; }
        .lobby button:hover { transform: scale(1.05); }
        .lobby button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .room-code { font-size: 1.8rem; font-weight: 900; color: #f7d875; letter-spacing: 5px; background: #0e1e14; padding: 5px 20px; border-radius: 15px; display: inline-block; margin: 5px 0; }
        
        .game-panel { display: flex; flex-wrap: wrap; gap: 15px; }
        .left-col { flex: 2; min-width: 250px; }
        .right-col { flex: 3; min-width: 280px; }
        
        .auction-box { background: #1d3223; border-radius: 20px; padding: 15px; border: 2px solid #7a945a; }
        .animal-card { background: #0e1e14; border-radius: 15px; padding: 15px; text-align: center; border: 1px solid #b9a06b; }
        .animal-emoji { font-size: 4rem; }
        .animal-name { font-size: 1.5rem; font-weight: bold; color: #f7d875; }
        .animal-power { font-size: 1rem; background: #4a2f1a; display: inline-block; padding: 3px 20px; border-radius: 20px; margin-top: 5px; }
        
        .bid-controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 12px 0; }
        .bid-controls button { padding: 12px 16px; border-radius: 30px; font-weight: bold; border: none; border-bottom: 3px solid #1a2a1a; cursor: pointer; flex: 1; min-width: 65px; color: #fff; font-size: 0.9rem; }
        .bid-controls button:disabled { opacity: 0.3; pointer-events: none; }
        .btn-bid { background: #1f8a3a; }
        .btn-pass { background: #8a4a3a; }
        .btn-spin { background: #c9a04a; color: #1e2c1a; }
        
        .info-line { display: flex; justify-content: space-between; background: #1a2e1f; padding: 8px 12px; border-radius: 25px; margin: 5px 0; flex-wrap: wrap; font-size: 0.85rem; }
        
        .player-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 8px; }
        .player-card { background: #152318; border-radius: 15px; padding: 10px; border: 2px solid #4a6b3a; }
        .player-card.active { border-color: #f7d875; box-shadow: 0 0 25px #f7d87555; }
        .player-card.finished { opacity: 0.4; }
        .player-card.you { border-color: #4a9aff; background: #1a2a4a; }
        .player-name { font-weight: bold; font-size: 0.95rem; color: #e0d6a0; }
        .player-budget { font-size: 1.1rem; background: #0f1f12; padding: 0 8px; border-radius: 15px; display: inline-block; }
        .player-crew { font-size: 0.7rem; background: #253d2b; border-radius: 12px; padding: 5px; min-height: 40px; margin-top: 5px; }
        .player-crew span { display: inline-block; background: #0e1a0e; padding: 2px 6px; border-radius: 15px; margin: 2px; border: 1px solid #7a945a; }
        
        .winner-banner { background: #f7d875; color: #1e2c1a; padding: 12px; border-radius: 25px; text-align: center; font-size: 1.5rem; font-weight: 900; margin: 10px 0; border: 3px solid #fff; display: none; }
        .log-area { background: #0f1a12; border-radius: 15px; padding: 8px; height: 100px; overflow-y: auto; font-size: 0.75rem; border: 1px solid #5a6f4a; margin-top: 8px; }
        .log-area div { border-bottom: 1px solid #2a402a; padding: 2px 0; }
        
        .sync-bar { background: #2a402a; padding: 6px 12px; border-radius: 15px; font-size: 0.75rem; margin-top: 8px; display: flex; justify-content: space-between; flex-wrap: wrap; }
        .waiting-msg { text-align: center; padding: 15px; font-size: 1.1rem; color: #f7d875; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        
        .top-bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 12px; }
        .top-bar button { padding: 8px 18px; border-radius: 25px; border: 2px solid #b9a06b; background: #3a5a3a; color: #fff; font-weight: bold; font-size: 0.85rem; cursor: pointer; }
        .top-bar button:disabled { opacity: 0.4; cursor: not-allowed; }
        .top-bar button.active { background: #f7d875; color: #1e2c1a; border-color: #fff; }
        .reset-btn { background: #7a3a3a !important; border-color: #a55 !important; }
        
        .status-badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 0.65rem; font-weight: bold; }
        .status-badge.host { background: #f7d875; color: #1e2c1a; }
        .status-badge.you { background: #4a9aff; color: #fff; }
        
        .forced-warning {
            background: #8a4a3a;
            border: 2px solid #f7d875;
            border-radius: 15px;
            padding: 10px;
            margin: 8px 0;
            text-align: center;
            font-weight: bold;
            color: #f7d875;
            display: none;
        }
        
        @media (max-width: 600px) { h1 { font-size: 1.3rem; } .animal-emoji { font-size: 3rem; } .player-grid { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>
<div class="container">
    <h1>⚔️ HAYVAN SAVAŞI ⚔️</h1>

    <!-- LOBBY -->
    <div class="lobby">
        <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:8px;align-items:center;">
            <input type="text" id="roomInput" placeholder="Kod (4 harf)" maxlength="4" style="text-transform:uppercase;">
            <button id="joinBtn">🔗 Katıl</button>
            <button id="createBtn">✨ Oluştur</button>
        </div>
        <div style="margin-top:8px;">
            <span>📋 Oda: </span>
            <span class="room-code" id="roomDisplay">-----</span>
            <button id="copyBtn" style="padding:4px 12px;font-size:0.8rem;">📋 Kopyala</button>
        </div>
        <div id="playerList" style="margin-top:5px;font-size:0.85rem;color:#aac;"></div>
        <div id="waitingMsg" class="waiting-msg" style="display:none;">⏳ Oyuncu bekleniyor...</div>
        <div class="sync-bar">
            <span>🔄 <span id="syncStatus">Bağlanıyor...</span></span>
            <span>👥 <span id="playerCount">0</span> kişi</span>
        </div>
    </div>

    <!-- OYUN -->
    <div class="top-bar">
        <button class="setup-btn" data-player="2" disabled>👥 2 Kişi</button>
        <button class="setup-btn" data-player="3" disabled>👥 3 Kişi</button>
        <button class="setup-btn" data-player="4" disabled>👥 4 Kişi</button>
        <button class="reset-btn" id="resetBtn" disabled>🔄 Yeni Oyun</button>
    </div>

    <div class="game-panel">
        <div class="left-col">
            <div class="auction-box">
                <div class="animal-card">
                    <div class="animal-emoji" id="animalEmoji">❓</div>
                    <div class="animal-name" id="animalName">HAYVAN YOK</div>
                    <div class="animal-power">⚡ Güç: <span id="animalPower">?</span></div>
                </div>
                
                <div id="forcedWarning" class="forced-warning">
                    ⚠️ Herkes pas geçti! Hayvan zorunlu alınacak!
                </div>
                
                <div class="bid-controls">
                    <button class="btn-bid" id="bidBtn" disabled>💰 Arttır (+1$)</button>
                    <button class="btn-pass" id="passBtn" disabled>⛔ Pas</button>
                    <button class="btn-spin" id="spinBtn" disabled>🎲 ÇEVİR</button>
                </div>
                <div class="info-line">
                    <span>⏳ Sıra: <strong id="turnIndicator">-</strong></span>
                    <span>🏆 En Yüksek: <strong id="highestBid">0$</strong> (<span id="highestBidder">-</span>)</span>
                </div>
                <div class="info-line" style="background:#2a1a1a; border:1px solid #8a4a3a;">
                    <span>🎯 Hayvanı Çeviren: <strong id="spinnerInfo">-</strong></span>
                    <span>📦 Pas Geçenler: <strong id="passInfo">0</strong></span>
                </div>
            </div>
            <div id="winnerBanner" class="winner-banner">🏆 KAZANAN:</div>
            <div class="log-area" id="logArea"><div>🎮 Oda oluştur veya katıl.</div></div>
        </div>
        <div class="right-col">
            <div id="playerCards" class="player-grid"></div>
        </div>
    </div>
</div>

<script>
    // ================================================================
    // 🔥 FIREBASE KONFİGÜRASYONU
    // ================================================================
    const firebaseConfig = {
        apiKey: "AIzaSyDPB_kxCOm5FzjNfhJiJliIBg_kRTLJzbQ",
        authDomain: "furkan-portfolio.firebaseapp.com",
        databaseURL: "https://hayvan-19016-default-rtdb.firebaseio.com",
        projectId: "furkan-portfolio",
        storageBucket: "furkan-portfolio.firebasestorage.app",
        messagingSenderId: "850833690471",
        appId: "1:850833690471:web:436c1346f6776d04ba69c2",
        measurementId: "G-Y9694RE0JX"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ================================================================
    // HAYVANLAR
    // ================================================================
    const ANIMALS = [
        { name: "Fare", emoji: "🐭", power: 2 }, { name: "Sincap", emoji: "🐿️", power: 3 },
        { name: "Tavşan", emoji: "🐇", power: 4 }, { name: "Köpek", emoji: "🐕", power: 5 },
        { name: "Kurt", emoji: "🐺", power: 7 }, { name: "Leopar", emoji: "🐆", power: 8 },
        { name: "Kaplan", emoji: "🐅", power: 9 }, { name: "Aslan", emoji: "🦁", power: 10 },
        { name: "Ayı", emoji: "🐻", power: 10 }, { name: "Goril", emoji: "🦍", power: 11 },
        { name: "Fil", emoji: "🐘", power: 12 }, { name: "Su Aygırı", emoji: "🦛", power: 13 },
        { name: "Gergedan", emoji: "🦏", power: 14 }, { name: "Timsah", emoji: "🐊", power: 15 },
        { name: "Kartal", emoji: "🦅", power: 16 }, { name: "Ejderha", emoji: "🐉", power: 20 },
        { name: "Dinozor", emoji: "🦕", power: 22 }, { name: "Mamut", emoji: "🦣", power: 24 },
        { name: "Dev Ahtapot", emoji: "🐙", power: 26 }, { name: "Deniz Canavarı", emoji: "🐲", power: 30 }
    ];

    function randomAnimal() { return ANIMALS[Math.floor(Math.random() * ANIMALS.length)]; }

    // ================================================================
    // OYUN DURUMU
    // ================================================================
    let myId = null;
    let myRoom = null;
    let isHost = false;
    let gameStarted = false;
    let gameData = null;

    // ================================================================
    // DOM
    // ================================================================
    const $ = id => document.getElementById(id);
    const logEl = $('logArea');

    function log(msg) {
        console.log('📝', msg);
        const d = document.createElement('div');
        d.textContent = msg;
        logEl.prepend(d);
        if (logEl.children.length > 30) logEl.removeChild(logEl.lastChild);
    }

    function generateCode() {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        let code = '';
        for (let i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * 26)];
        return code;
    }

    // ================================================================
    // UI GÜNCELLEME
    // ================================================================
    function updateUI(data) {
        if (!data) { console.warn('⚠️ Veri yok!'); return; }
        gameData = data;
        gameStarted = data.gameStarted || false;

        const players = data.players || {};
        const ids = Object.keys(players);
        const currentId = data.currentPlayerId || null;
        const animal = data.currentAnimal || null;
        const bid = data.highestBid || 0;
        const bidder = data.highestBidder || null;
        const phase = data.turnPhase || 'idle';
        const over = data.gameOver || false;
        const winner = data.winnerId || null;
        const spinnerId = data.spinnerId || null;
        const passCount = data.passCount || 0;
        const totalPlayers = ids.length;

        // Oyuncu listesi
        const listEl = $('playerList');
        listEl.innerHTML = ids.map(id => {
            const p = players[id];
            const isMe = id === myId;
            const passed = data.passedPlayers && data.passedPlayers.includes(id);
            return `<span style="background:#1a2e1f;padding:2px 10px;border-radius:15px;margin:2px;display:inline-block;${passed ? 'opacity:0.4;' : ''}">
                ${p?.name || id} ${p?.isHost ? '⭐' : ''} ${isMe ? '👤' : ''} ${passed ? '⛔' : ''}
            </span>`;
        }).join(' ');
        $('playerCount').textContent = ids.length;

        // Bekleme mesajı
        const wMsg = $('waitingMsg');
        const setupBtns = document.querySelectorAll('.setup-btn');
        const resetBtn = $('resetBtn');

        if (!gameStarted && ids.length < 2) {
            wMsg.style.display = 'block';
            wMsg.textContent = '⏳ Oyuncu bekleniyor... (' + ids.length + '/2)';
            setupBtns.forEach(b => b.disabled = true);
            resetBtn.disabled = true;
        } else if (!gameStarted && ids.length >= 2) {
            wMsg.style.display = 'none';
            setupBtns.forEach(b => b.disabled = !isHost);
            resetBtn.disabled = !isHost;
        } else {
            wMsg.style.display = 'none';
            setupBtns.forEach(b => b.disabled = true);
            resetBtn.disabled = !isHost;
        }

        // Butonlar
        const isMyTurn = currentId === myId;
        const myPlayer = players[myId];
        const finished = myPlayer?.finished || false;
        const hasPassed = data.passedPlayers && data.passedPlayers.includes(myId);
        const canBid = gameStarted && phase === 'bidding' && isMyTurn && !finished && animal && !over && !hasPassed;
        const canPass = gameStarted && phase === 'bidding' && isMyTurn && !finished && animal && !over && !hasPassed;
        const canSpin = gameStarted && (phase === 'idle' || phase === 'finished') && isMyTurn && !finished && !over;

        $('bidBtn').disabled = !canBid;
        $('passBtn').disabled = !canPass;
        $('spinBtn').disabled = !canSpin;

        // Hayvan
        if (animal) {
            $('animalEmoji').textContent = animal.emoji;
            $('animalName').textContent = animal.name;
            $('animalPower').textContent = animal.power;
        } else {
            $('animalEmoji').textContent = '❓';
            $('animalName').textContent = 'HAYVAN YOK';
            $('animalPower').textContent = '?';
        }

        // Sıra ve teklif
        $('turnIndicator').textContent = players[currentId]?.name || '-';
        $('highestBid').textContent = bid + '$';
        $('highestBidder').textContent = bidder !== null ? (players[bidder]?.name || '-') : '-';
        
        // Çeviren ve pas bilgisi
        $('spinnerInfo').textContent = spinnerId ? (players[spinnerId]?.name || '-') : '-';
        $('passInfo').textContent = passCount + '/' + totalPlayers;

        // Zorunlu alım uyarısı
        const forcedWarning = $('forcedWarning');
        if (phase === 'finished' && animal && passCount >= totalPlayers) {
            forcedWarning.style.display = 'block';
        } else {
            forcedWarning.style.display = 'none';
        }

        // Kazanan
        if (over && winner) {
            const w = players[winner];
            $('winnerBanner').style.display = 'block';
            $('winnerBanner').innerHTML = '🏆 KAZANAN: ' + (w?.name || '?') + ' (⚡' + (w?.totalPower || 0) + ') 🏆';
        } else {
            $('winnerBanner').style.display = 'none';
        }

        // Oyuncu kartları
        const cardsEl = $('playerCards');
        cardsEl.innerHTML = '';
        if (ids.length === 0) {
            cardsEl.innerHTML = '<div style="text-align:center;padding:20px;color:#888;">Henüz oyuncu yok</div>';
            return;
        }
        ids.forEach(id => {
            const p = players[id];
            if (!p) return;
            const card = document.createElement('div');
            card.className = 'player-card';
            if (id === currentId && !over) card.classList.add('active');
            if (p.finished) card.classList.add('finished');
            if (id === myId) card.classList.add('you');
            
            const passed = data.passedPlayers && data.passedPlayers.includes(id);
            if (passed) card.style.opacity = '0.4';

            const crewHtml = (p.crew || []).length > 0 
                ? p.crew.map(a => `<span>${a.emoji}${a.name}(${a.power})</span>`).join(' ')
                : '<span style="opacity:0.4;">Boş</span>';

            card.innerHTML = `
                <div style="display:flex;justify-content:space-between;flex-wrap:wrap;">
                    <span class="player-name">${p.name} ${passed ? '⛔' : ''}</span>
                    <span class="player-budget">💰${p.budget || 0}$</span>
                </div>
                <div style="font-size:0.7rem;margin-top:3px;">
                    Kadro (${(p.crew||[]).length}/5) ⚡${p.totalPower || 0}
                    ${id === myId ? ' <span class="status-badge you">SEN</span>' : ''}
                    ${p.isHost ? ' <span class="status-badge host">⭐</span>' : ''}
                </div>
                <div class="player-crew">${crewHtml}</div>
            `;
            cardsEl.appendChild(card);
        });
    }

    // ================================================================
    // FIREBASE İŞLEMLERİ
    // ================================================================
    function getRoomRef() {
        return db.ref('rooms/' + myRoom);
    }

    function createRoom() {
        console.log('✨ Oda oluşturuluyor...');
        const code = generateCode();
        myRoom = code;
        isHost = true;
        myId = 'p_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
        $('roomDisplay').textContent = code;
        $('roomInput').value = code;

        const roomRef = db.ref('rooms/' + code);
        roomRef.set({
            players: {
                [myId]: {
                    name: 'Oyuncu 1',
                    budget: 15,
                    crew: [],
                    totalPower: 0,
                    finished: false,
                    isHost: true
                }
            },
            currentPlayerId: myId,
            currentAnimal: null,
            spinnerId: null,
            highestBid: 0,
            highestBidder: null,
            turnPhase: 'idle',
            gameOver: false,
            winnerId: null,
            gameStarted: false,
            playerCount: 1,
            passCount: 0,
            passedPlayers: []
        });

        log('✅ Oda oluşturuldu! Kod: ' + code);
        log('📋 Arkadaşlarına bu kodu ver.');
        $('syncStatus').textContent = '✅ Oda hazır';
        listenRoom(code);
    }

    function joinRoom() {
        console.log('🔗 Odaya katılınıyor...');
        let code = $('roomInput').value.toUpperCase().trim();
        if (!code || code.length !== 4) {
            log('❌ 4 harfli kod girin!');
            return;
        }
        myRoom = code;
        myId = 'p_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
        $('roomDisplay').textContent = code;

        const roomRef = db.ref('rooms/' + code);
        roomRef.once('value', (snap) => {
            const data = snap.val();
            if (!data) {
                log('❌ Oda bulunamadı!');
                return;
            }
            const players = data.players || {};
            const count = Object.keys(players).length;
            if (count >= 4) {
                log('❌ Oda dolu! (Maks 4 kişi)');
                return;
            }
            if (players[myId]) {
                log('ℹ️ Zaten bu odadasın!');
                listenRoom(code);
                return;
            }

            const updates = {};
            updates['players/' + myId] = {
                name: 'Oyuncu ' + (count + 1),
                budget: 15,
                crew: [],
                totalPower: 0,
                finished: false,
                isHost: false
            };
            updates['playerCount'] = count + 1;

            roomRef.update(updates);
            log('✅ Odaya katıldın! (' + (count + 1) + '/4)');
            $('syncStatus').textContent = '✅ Bağlandı';
            listenRoom(code);
        });
    }

    function listenRoom(code) {
        const roomRef = db.ref('rooms/' + code);
        roomRef.on('value', (snap) => {
            const data = snap.val();
            if (!data) {
                log('❌ Oda silinmiş veya bulunamadı.');
                return;
            }
            gameStarted = data.gameStarted || false;
            if (data.players && data.players[myId]) {
                isHost = data.players[myId].isHost || false;
            }
            updateUI(data);
            $('syncStatus').textContent = '✅ Gerçek zamanlı';
        });
    }

    // ================================================================
    // OYUN HAMLELERİ
    // ================================================================
    function startGame(count) {
        if (!isHost) {
            log('⚠️ Sadece ev sahibi başlatabilir!');
            return;
        }
        const roomRef = getRoomRef();
        roomRef.once('value', (snap) => {
            const data = snap.val();
            if (!data) return;
            const players = data.players || {};
            const ids = Object.keys(players);
            if (ids.length < 2) {
                log('❌ En az 2 oyuncu gerekli!');
                return;
            }

            const names = ['🦊 Aslan', '🐺 Kurt', '🦅 Şahin', '🐉 Ejder'];
            const updates = {};
            ids.forEach((id, idx) => {
                updates['players/' + id + '/name'] = names[idx % names.length] + (idx + 1);
                updates['players/' + id + '/budget'] = 15;
                updates['players/' + id + '/crew'] = [];
                updates['players/' + id + '/totalPower'] = 0;
                updates['players/' + id + '/finished'] = false;
            });
            updates['gameStarted'] = true;
            updates['gameOver'] = false;
            updates['winnerId'] = null;
            updates['currentPlayerId'] = ids[0];
            updates['currentAnimal'] = null;
            updates['spinnerId'] = null;
            updates['highestBid'] = 0;
            updates['highestBidder'] = null;
            updates['turnPhase'] = 'idle';
            updates['passCount'] = 0;
            updates['passedPlayers'] = [];

            roomRef.update(updates);
            log('🎮 Oyun başladı! ' + ids.length + ' kişi.');
            log('🔄 "Çarkı Çevir" ile hayvan getirin!');
        });
    }

    // ================================================================
    // ⭐ ÇARKI ÇEVİR
    // ================================================================
    function spinAnimal() {
        if (!gameStarted) {
            log('⚠️ Oyun başlamadı!');
            return;
        }
        const roomRef = getRoomRef();
        roomRef.once('value', (snap) => {
            const data = snap.val();
            if (!data || data.gameOver) return;
            if (data.turnPhase !== 'idle' && data.turnPhase !== 'finished') {
                log('⚠️ Önce bu hayvanı sonuçlandırın!');
                return;
            }
            if (data.currentPlayerId !== myId) {
                log('⏳ Sıra sende değil!');
                return;
            }
            if (data.players[myId]?.finished) {
                log('❌ Kadron dolu! Sıra geçiyor...');
                const ids = Object.keys(data.players);
                let idx = ids.indexOf(myId);
                let nextId = null;
                for (let i = 1; i <= ids.length; i++) {
                    const ni = ids[(idx + i) % ids.length];
                    if (!data.players[ni]?.finished) { nextId = ni; break; }
                }
                if (nextId) roomRef.update({ currentPlayerId: nextId });
                return;
            }

            const animal = randomAnimal();
            const updates = {
                currentAnimal: animal,
                spinnerId: myId,
                highestBid: 0,
                highestBidder: null,
                turnPhase: 'bidding',
                passCount: 0,
                passedPlayers: []
            };
            roomRef.update(updates);
            log('🎲 ' + animal.emoji + ' ' + animal.name + ' (⚡' + animal.power + ') çıktı!');
            log('💡 ' + data.players[myId].name + ' 1$ teklif verebilir veya pas geçebilir.');
        });
    }

    // ================================================================
    // ⭐ TEKLİF VER (Arttır)
    // ================================================================
    function placeBid() {
        if (!gameStarted) {
            log('⚠️ Oyun başlamadı!');
            return;
        }
        const roomRef = getRoomRef();
        roomRef.once('value', (snap) => {
            const data = snap.val();
            if (!data || data.gameOver || data.turnPhase !== 'bidding' || !data.currentAnimal) {
                log('⚠️ Teklif verilemez!');
                return;
            }
            if (data.currentPlayerId !== myId) {
                log('⏳ Sıra sende değil!');
                return;
            }
            const player = data.players[myId];
            if (!player || player.finished) return;
            
            if (data.passedPlayers && data.passedPlayers.includes(myId)) {
                log('⛔ Zaten pas geçtin!');
                return;
            }
            
            if (player.budget < 1) {
                log('❌ Bütçen yok! Otomatik pas geçiyorsun.');
                let updates = {};
                const passedPlayers = data.passedPlayers || [];
                if (!passedPlayers.includes(myId)) {
                    passedPlayers.push(myId);
                    updates.passedPlayers = passedPlayers;
                    updates.passCount = (data.passCount || 0) + 1;
                    log(player.name + ' ⛔ otomatik pas geçti (bütçe yok).');
                }
                const ids = Object.keys(data.players);
                let idx = ids.indexOf(myId);
                let nextId = null;
                for (let i = 1; i <= ids.length; i++) {
                    const ni = ids[(idx + i) % ids.length];
                    if (!data.players[ni]?.finished && !passedPlayers.includes(ni)) {
                        nextId = ni; break;
                    }
                }
                if (nextId) updates.currentPlayerId = nextId;
                roomRef.update(updates);
                return;
            }

            const newBid = (data.highestBid || 0) + 1;
            if (newBid > player.budget) {
                log('❌ Bütçen ' + player.budget + '$, ' + newBid + '$ yetmiyor!');
                return;
            }

            const updates = {
                highestBid: newBid,
                highestBidder: myId
            };

            const ids = Object.keys(data.players);
            const passedPlayers = data.passedPlayers || [];
            let idx = ids.indexOf(myId);
            let nextId = null;
            for (let i = 1; i <= ids.length; i++) {
                const ni = ids[(idx + i) % ids.length];
                if (!data.players[ni]?.finished && !passedPlayers.includes(ni) && ni !== myId) {
                    nextId = ni;
                    break;
                }
            }
            
            if (nextId) {
                updates.currentPlayerId = nextId;
                log(player.name + ' ➡️ ' + newBid + '$ verdi. Sıra ' + data.players[nextId].name + '\'de.');
            } else {
                log(player.name + ' ➡️ ' + newBid + '$ verdi!');
            }

            roomRef.update(updates);
        });
    }

    // ================================================================
    // ⭐ PAS GEÇ + ZORUNLU ALIM (DÜZELTİLDİ!)
    // ================================================================
    function handlePass() {
        if (!gameStarted) {
            log('⚠️ Oyun başlamadı!');
            return;
        }
        const roomRef = getRoomRef();
        roomRef.once('value', (snap) => {
            const data = snap.val();
            if (!data || data.gameOver || data.turnPhase !== 'bidding' || !data.currentAnimal) {
                log('⚠️ Pas geçilemez!');
                return;
            }
            if (data.currentPlayerId !== myId) {
                log('⏳ Sıra sende değil!');
                return;
            }
            const player = data.players[myId];
            if (!player || player.finished) return;
            
            if (data.passedPlayers && data.passedPlayers.includes(myId)) {
                log('⛔ Zaten pas geçtin!');
                return;
            }

            let updates = {};
            const passedPlayers = data.passedPlayers || [];
            passedPlayers.push(myId);
            updates.passedPlayers = passedPlayers;
            
            const passCount = (data.passCount || 0) + 1;
            updates.passCount = passCount;
            
            if (data.highestBidder === myId) {
                updates.highestBid = 0;
                updates.highestBidder = null;
                log(player.name + ' en yüksek tekliften vazgeçti!');
            }
            
            log(player.name + ' ⛔ pas geçti.');

            const totalPlayers = Object.keys(data.players).length;
            
            // ============================================================
            // ⭐ HERKES PAS GEÇTİ Mİ? ZORUNLU ALIM!
            // ============================================================
            if (passCount >= totalPlayers) {
                const spinnerId = data.spinnerId;
                const spinner = data.players[spinnerId];
                const animal = data.currentAnimal;
                
                if (spinner && spinner.budget >= 1 && !spinner.finished) {
                    // ✅ ZORUNLU ALIM: Spinner 1$ öder
                    spinner.budget -= 1;
                    spinner.crew = spinner.crew || [];
                    spinner.crew.push({ ...animal });
                    spinner.totalPower = (spinner.totalPower || 0) + animal.power;
                    if (spinner.crew.length >= 5) spinner.finished = true;
                    
                    updates['players/' + spinnerId] = spinner;
                    updates.currentAnimal = null;
                    updates.turnPhase = 'finished';
                    updates.passCount = 0;
                    updates.passedPlayers = [];
                    
                    log('🚨 ZORUNLU ALIM! ' + spinner.name + ' ' + animal.emoji + ' ' + animal.name + ' 1$ ödeyerek aldı!');
                    log('📦 ' + spinner.name + ' kadrosu: ' + spinner.crew.length + '/5');
                    
                    // Sırayı bir sonraki oyuncuya ver
                    const ids = Object.keys(data.players);
                    let idx = ids.indexOf(spinnerId);
                    let nextId = null;
                    for (let i = 1; i <= ids.length; i++) {
                        const ni = ids[(idx + i) % ids.length];
                        if (!data.players[ni]?.finished) { nextId = ni; break; }
                    }
                    if (nextId) updates.currentPlayerId = nextId;
                    
                    roomRef.update(updates);
                    setTimeout(() => checkGameOver(roomRef), 300);
                    return;
                } else {
                    log('⚠️ ' + (spinner?.name || 'Çeviren kişi') + ' 1$ bütçesi yok veya kadrosu dolu! Hayvan elden gitti.');
                    updates.currentAnimal = null;
                    updates.turnPhase = 'finished';
                    updates.passCount = 0;
                    updates.passedPlayers = [];
                    
                    const ids = Object.keys(data.players);
                    let idx = ids.indexOf(myId);
                    let nextId = null;
                    for (let i = 1; i <= ids.length; i++) {
                        const ni = ids[(idx + i) % ids.length];
                        if (!data.players[ni]?.finished) { nextId = ni; break; }
                    }
                    if (nextId) updates.currentPlayerId = nextId;
                    
                    roomRef.update(updates);
                    setTimeout(() => checkGameOver(roomRef), 300);
                    return;
                }
            }

            // Sırayı bir sonraki aktif oyuncuya geçir
            const ids = Object.keys(data.players);
            let idx = ids.indexOf(myId);
            let nextId = null;
            for (let i = 1; i <= ids.length; i++) {
                const ni = ids[(idx + i) % ids.length];
                if (!data.players[ni]?.finished && !passedPlayers.includes(ni)) {
                    nextId = ni;
                    break;
                }
            }
            
            if (data.highestBidder && data.players[data.highestBidder] && 
                !data.players[data.highestBidder].finished && 
                !passedPlayers.includes(data.highestBidder)) {
                nextId = data.highestBidder;
            }

            if (nextId) {
                updates.currentPlayerId = nextId;
                log('⏳ Sıra ' + data.players[nextId].name + '\'de.');
            } else {
                // Hiç aktif oyuncu kalmadıysa spinner zorunlu alır
                const spinnerId = data.spinnerId;
                const spinner = data.players[spinnerId];
                const animal = data.currentAnimal;
                
                if (spinner && spinner.budget >= 1 && !spinner.finished) {
                    spinner.budget -= 1;
                    spinner.crew = spinner.crew || [];
                    spinner.crew.push({ ...animal });
                    spinner.totalPower = (spinner.totalPower || 0) + animal.power;
                    if (spinner.crew.length >= 5) spinner.finished = true;
                    
                    updates['players/' + spinnerId] = spinner;
                    updates.currentAnimal = null;
                    updates.turnPhase = 'finished';
                    updates.passCount = 0;
                    updates.passedPlayers = [];
                    
                    log('🚨 ZORUNLU ALIM! ' + spinner.name + ' ' + animal.emoji + ' ' + animal.name + ' 1$ ödeyerek aldı!');
                    
                    const ids2 = Object.keys(data.players);
                    let idx2 = ids2.indexOf(spinnerId);
                    let nextId2 = null;
                    for (let i = 1; i <= ids2.length; i++) {
                        const ni = ids2[(idx2 + i) % ids2.length];
                        if (!data.players[ni]?.finished) { nextId2 = ni; break; }
                    }
                    if (nextId2) updates.currentPlayerId = nextId2;
                    
                    roomRef.update(updates);
                    setTimeout(() => checkGameOver(roomRef), 300);
                    return;
                } else {
                    log('⚠️ Hayvan elden gitti!');
                    updates.currentAnimal = null;
                    updates.turnPhase = 'finished';
                    updates.passCount = 0;
                    updates.passedPlayers = [];
                    roomRef.update(updates);
                    setTimeout(() => checkGameOver(roomRef), 300);
                    return;
                }
            }
            
            roomRef.update(updates);
        });
    }

    // ================================================================
    // ⭐ OYUN BİTTİ Mİ KONTROL ET + NORMAL ALIM (DÜZELTİLDİ!)
    // ================================================================
    function checkGameOver(roomRef) {
        roomRef.once('value', (snap) => {
            const data = snap.val();
            if (!data || data.gameOver) return;
            
            const players = data.players || {};
            const ids = Object.keys(players);
            
            // Oyun bitiş kontrolü
            const allDone = ids.every(id => players[id].finished || players[id].budget < 1);
            const allFull = ids.every(id => (players[id].crew || []).length >= 5);
            
            if (allDone || allFull) {
                let maxP = -1, winId = null;
                ids.forEach(id => {
                    const total = (players[id].crew || []).reduce((sum, a) => sum + a.power, 0);
                    if (total > maxP) {
                        maxP = total;
                        winId = id;
                    }
                });
                roomRef.update({
                    gameOver: true,
                    winnerId: winId,
                    turnPhase: 'finished'
                });
                log('🏆 OYUN BİTTİ! Kazanan: ' + (players[winId]?.name || '?') + ' (⚡' + maxP + ')');
                return;
            }
            
            // ============================================================
            // ⭐ NORMAL ALIM: En yüksek teklifi veren hayvanı ALIR!
            // ============================================================
            // Eğer turnPhase 'finished' değilse ve currentAnimal varsa
            // ve herkes pas geçmediyse, en yüksek teklifi veren alır
            if (data.turnPhase === 'bidding' && data.currentAnimal) {
                const highestBidderId = data.highestBidder;
                const highestBid = data.highestBid || 0;
                
                // Eğer en yüksek teklif 0'dan büyükse ve bir kazanan varsa
                if (highestBidderId && highestBid > 0) {
                    const winner = data.players[highestBidderId];
                    const animal = data.currentAnimal;
                    
                    if (winner && !winner.finished && winner.budget >= highestBid) {
                        // ✅ NORMAL ALIM: Kazanan teklif ettiği kadar öder
                        winner.budget -= highestBid;
                        winner.crew = winner.crew || [];
                        winner.crew.push({ ...animal });
                        winner.totalPower = (winner.totalPower || 0) + animal.power;
                        if (winner.crew.length >= 5) winner.finished = true;
                        
                        const updates = {
                            'players/' + highestBidderId: winner,
                            currentAnimal: null,
                            turnPhase: 'finished',
                            passCount: 0,
                            passedPlayers: [],
                            highestBid: 0,
                            highestBidder: null
                        };
                        
                        // Sırayı bir sonraki oyuncuya ver
                        const ids2 = Object.keys(data.players);
                        let idx2 = ids2.indexOf(highestBidderId);
                        let nextId = null;
                        for (let i = 1; i <= ids2.length; i++) {
                            const ni = ids2[(idx2 + i) % ids2.length];
                            if (!data.players[ni]?.finished) { nextId = ni; break; }
                        }
                        if (nextId) updates.currentPlayerId = nextId;
                        
                        roomRef.update(updates);
                        log('🏅 ' + winner.name + ' ' + animal.emoji + ' ' + animal.name + ' ' + highestBid + '$ ödeyerek kazandı!');
                        log('📦 ' + winner.name + ' kadrosu: ' + winner.crew.length + '/5');
                        
                        setTimeout(() => checkGameOver(roomRef), 300);
                        return;
                    }
                }
            }
            
            // Eğer turnPhase 'finished' ise ve currentAnimal varsa, zorunlu alım kontrolü
            if (data.turnPhase === 'finished' && data.currentAnimal) {
                const spinnerId = data.spinnerId;
                const spinner = data.players[spinnerId];
                const animal = data.currentAnimal;
                
                if (spinner && spinner.budget >= 1 && !spinner.finished) {
                    spinner.budget -= 1;
                    spinner.crew = spinner.crew || [];
                    spinner.crew.push({ ...animal });
                    spinner.totalPower = (spinner.totalPower || 0) + animal.power;
                    if (spinner.crew.length >= 5) spinner.finished = true;
                    
                    const updates = {
                        'players/' + spinnerId: spinner,
                        currentAnimal: null,
                        turnPhase: 'finished',
                        passCount: 0,
                        passedPlayers: [],
                        highestBid: 0,
                        highestBidder: null
                    };
                    
                    roomRef.update(updates);
                    log('🚨 ZORUNLU ALIM (otomatik)! ' + spinner.name + ' ' + animal.emoji + ' ' + animal.name + ' 1$ ödeyerek aldı!');
                    setTimeout(() => checkGameOver(roomRef), 300);
                    return;
                }
            }
        });
    }

    function resetGame() {
        if (!isHost) {
            log('⚠️ Sadece ev sahibi sıfırlayabilir!');
            return;
        }
        const roomRef = getRoomRef();
        roomRef.once('value', (snap) => {
            const data = snap.val();
            if (!data) return;
            const updates = {};
            Object.keys(data.players).forEach(id => {
                updates['players/' + id + '/budget'] = 15;
                updates['players/' + id + '/crew'] = [];
                updates['players/' + id + '/totalPower'] = 0;
                updates['players/' + id + '/finished'] = false;
            });
            updates.gameOver = false;
            updates.winnerId = null;
            updates.currentAnimal = null;
            updates.spinnerId = null;
            updates.highestBid = 0;
            updates.highestBidder = null;
            updates.turnPhase = 'idle';
            updates.gameStarted = true;
            updates.passCount = 0;
            updates.passedPlayers = [];
            updates.currentPlayerId = Object.keys(data.players)[0];
            roomRef.update(updates);
            log('🔄 Oyun sıfırlandı!');
        });
    }

    // ================================================================
    // EVENTLER
    // ================================================================
    $('createBtn').addEventListener('click', createRoom);
    $('joinBtn').addEventListener('click', joinRoom);

    $('copyBtn').addEventListener('click', () => {
        const code = $('roomDisplay').textContent;
        if (code && code !== '-----') {
            navigator.clipboard.writeText(code).then(() => log('📋 Oda kodu kopyalandı!'));
        }
    });

    $('roomInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') joinRoom();
    });

    document.querySelectorAll('.setup-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.setup-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            startGame(parseInt(btn.dataset.player));
        });
    });

    $('resetBtn').addEventListener('click', resetGame);
    $('spinBtn').addEventListener('click', spinAnimal);
    $('bidBtn').addEventListener('click', placeBid);
    $('passBtn').addEventListener('click', handlePass);

    // ================================================================
    // BAŞLANGIÇ
    // ================================================================
    log('🎮 Firebase ile gerçek zamanlı oyuna hoş geldin!');
    log('📋 Oda oluştur veya mevcut bir odaya katıl.');
    $('syncStatus').textContent = '✅ Bağlantı hazır';
    console.log('✅ Oyun başlatıldı!');
</script>
</body>
