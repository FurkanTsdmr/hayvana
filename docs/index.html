<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🐾 Hayvan Savaşı - Online</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        body { background: #1a2f1a; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 15px; color: #fff; }
        .container { max-width: 950px; width: 100%; background: rgba(0,0,0,0.85); border-radius: 30px; padding: 20px; border: 2px solid #c9a84b; }
        h1 { text-align: center; color: #f7d875; font-size: 1.8rem; margin-bottom: 12px; }
        
        .lobby { background: #1d3223; border-radius: 20px; padding: 15px; text-align: center; border: 2px solid #7a945a; margin-bottom: 15px; }
        .lobby input { padding: 12px 18px; border-radius: 25px; border: 2px solid #b9a06b; font-size: 1rem; width: 160px; text-align: center; background: #0e1e14; color: #f7d875; }
        .lobby button { padding: 12px 22px; border-radius: 25px; border: none; font-weight: bold; font-size: 0.95rem; cursor: pointer; background: #f7d875; color: #1e2c1a; margin: 5px; transition: 0.3s; }
        .lobby button:hover { transform: scale(1.05); }
        .lobby button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .room-code { font-size: 1.8rem; font-weight: 900; color: #f7d875; letter-spacing: 5px; background: #0e1e14; padding: 5px 20px; border-radius: 15px; display: inline-block; margin: 5px 0; }
        
        .game-panel { display: flex; flex-wrap: wrap; gap: 15px; }
        .left-col { flex: 2; min-width: 250px; }
        .right-col { flex: 3; min-width: 280px; }
        
        .auction-box { background: #1d3223; border-radius: 20px; padding: 15px; border: 2px solid #7a945a; }
        .animal-card { background: #0e1e14; border-radius: 15px; padding: 15px; text-align: center; border: 1px solid #b9a06b; }
        .animal-emoji { font-size: 4rem; }
        .animal-name { font-size: 1.5rem; font-weight: bold; color: #f7d875; }
        .animal-power { font-size: 1rem; background: #4a2f1a; display: inline-block; padding: 3px 20px; border-radius: 20px; margin-top: 5px; }
        
        .bid-controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 12px 0; }
        .bid-controls button { padding: 12px 16px; border-radius: 30px; font-weight: bold; border: none; border-bottom: 3px solid #1a2a1a; cursor: pointer; flex: 1; min-width: 65px; color: #fff; font-size: 0.9rem; }
        .bid-controls button:disabled { opacity: 0.3; pointer-events: none; }
        .btn-bid { background: #1f8a3a; }
        .btn-pass { background: #8a4a3a; }
        .btn-spin { background: #c9a04a; color: #1e2c1a; }
        
        .info-line { display: flex; justify-content: space-between; background: #1a2e1f; padding: 8px 12px; border-radius: 25px; margin: 5px 0; flex-wrap: wrap; font-size: 0.85rem; }
        
        .player-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 8px; }
        .player-card { background: #152318; border-radius: 15px; padding: 10px; border: 2px solid #4a6b3a; }
        .player-card.active { border-color: #f7d875; box-shadow: 0 0 25px #f7d87555; }
        .player-card.finished { opacity: 0.4; }
        .player-card.you { border-color: #4a9aff; background: #1a2a4a; }
        .player-name { font-weight: bold; font-size: 0.95rem; color: #e0d6a0; }
        .player-budget { font-size: 1.1rem; background: #0f1f12; padding: 0 8px; border-radius: 15px; display: inline-block; }
        .player-crew { font-size: 0.7rem; background: #253d2b; border-radius: 12px; padding: 5px; min-height: 40px; margin-top: 5px; }
        .player-crew span { display: inline-block; background: #0e1a0e; padding: 2px 6px; border-radius: 15px; margin: 2px; border: 1px solid #7a945a; }
        
        .winner-banner { background: #f7d875; color: #1e2c1a; padding: 12px; border-radius: 25px; text-align: center; font-size: 1.5rem; font-weight: 900; margin: 10px 0; border: 3px solid #fff; display: none; }
        .log-area { background: #0f1a12; border-radius: 15px; padding: 8px; height: 100px; overflow-y: auto; font-size: 0.75rem; border: 1px solid #5a6f4a; margin-top: 8px; }
        .log-area div { border-bottom: 1px solid #2a402a; padding: 2px 0; }
        
        .sync-bar { background: #2a402a; padding: 6px 12px; border-radius: 15px; font-size: 0.75rem; margin-top: 8px; display: flex; justify-content: space-between; flex-wrap: wrap; }
        .waiting-msg { text-align: center; padding: 15px; font-size: 1.1rem; color: #f7d875; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        
        .top-bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 12px; }
        .top-bar button { padding: 8px 18px; border-radius: 25px; border: 2px solid #b9a06b; background: #3a5a3a; color: #fff; font-weight: bold; font-size: 0.85rem; cursor: pointer; }
        .top-bar button:disabled { opacity: 0.4; cursor: not-allowed; }
        .top-bar button.active { background: #f7d875; color: #1e2c1a; border-color: #fff; }
        .reset-btn { background: #7a3a3a !important; border-color: #a55 !important; }
        
        .status-badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 0.65rem; font-weight: bold; }
        .status-badge.host { background: #f7d875; color: #1e2c1a; }
        .status-badge.you { background: #4a9aff; color: #fff; }
        
        .forced-warning {
            background: #8a4a3a;
            border: 2px solid #f7d875;
            border-radius: 15px;
            padding: 10px;
            margin: 8px 0;
            text-align: center;
            font-weight: bold;
            color: #f7d875;
            display: none;
        }
        
        @media (max-width: 600px) { h1 { font-size: 1.3rem; } .animal-emoji { font-size: 3rem; } .player-grid { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>
<div class="container">
    <h1>⚔️ HAYVAN SAVAŞI ⚔️</h1>

    <div class="lobby">
        <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:8px;align-items:center;">
            <input type="text" id="roomInput" placeholder="Kod (4 harf)" maxlength="4" style="text-transform:uppercase;">
            <button id="joinBtn">🔗 Katıl</button>
            <button id="createBtn">✨ Oluştur</button>
        </div>
        <div style="margin-top:8px;">
            <span>📋 Oda: </span>
            <span class="room-code" id="roomDisplay">-----</span>
            <button id="copyBtn" style="padding:4px 12px;font-size:0.8rem;">📋 Kopyala</button>
        </div>
        <div id="playerList" style="margin-top:5px;font-size:0.85rem;color:#aac;"></div>
        <div id="waitingMsg" class="waiting-msg" style="display:none;">⏳ Oyuncu bekleniyor...</div>
        <div class="sync-bar">
            <span>🔄 <span id="syncStatus">Bağlanıyor...</span></span>
            <span>👥 <span id="playerCount">0</span> kişi</span>
        </div>
    </div>

    <div class="top-bar">
        <button class="setup-btn" data-player="2" disabled>👥 2 Kişi</button>
        <button class="setup-btn" data-player="3" disabled>👥 3 Kişi</button>
        <button class="setup-btn" data-player="4" disabled>👥 4 Kişi</button>
        <button class="reset-btn" id="resetBtn" disabled>🔄 Yeni Oyun</button>
    </div>

    <div class="game-panel">
        <div class="left-col">
            <div class="auction-box">
                <div class="animal-card">
                    <div class="animal-emoji" id="animalEmoji">❓</div>
                    <div class="animal-name" id="animalName">HAYVAN YOK</div>
                    <div class="animal-power">⚡ Güç: <span id="animalPower">?</span></div>
                </div>
                
                <div id="forcedWarning" class="forced-warning">
                    ⚠️ Herkes pas geçti! Hayvan zorunlu alınacak!
                </div>
                
                <div class="bid-controls">
                    <button class="btn-bid" id="bidBtn" disabled>💰 Arttır (+1$)</button>
                    <button class="btn-pass" id="passBtn" disabled>⛔ Pas</button>
                    <button class="btn-spin" id="spinBtn" disabled>🎲 ÇEVİR</button>
                </div>
                <div class="info-line">
                    <span>⏳ Sıra: <strong id="turnIndicator">-</strong></span>
                    <span>🏆 En Yüksek: <strong id="highestBid">0$</strong> (<span id="highestBidder">-</span>)</span>
                </div>
                <div class="info-line" style="background:#2a1a1a; border:1px solid #8a4a3a;">
                    <span>🎯 Hayvanı Çeviren: <strong id="spinnerInfo">-</strong></span>
                    <span>📦 Pas Geçenler: <strong id="passInfo">0</strong></span>
                </div>
            </div>
            <div id="winnerBanner" class="winner-banner">🏆 KAZANAN:</div>
            <div class="log-area" id="logArea"><div>🎮 Oda oluştur veya katıl.</div></div>
        </div>
        <div class="right-col">
            <div id="playerCards" class="player-grid"></div>
        </div>
    </div>
</div>

<script>
    // ================================================================
    // FIREBASE KONFIGURASYONU
    // ================================================================
    var firebaseConfig = {
        apiKey: "AIzaSyDPB_kxCOm5FzjNfhJiJliIBg_kRTLJzbQ",
        authDomain: "furkan-portfolio.firebaseapp.com",
        databaseURL: "https://hayvan-19016-default-rtdb.firebaseio.com",
        projectId: "furkan-portfolio",
        storageBucket: "furkan-portfolio.firebasestorage.app",
        messagingSenderId: "850833690471",
        appId: "1:850833690471:web:436c1346f6776d04ba69c2",
        measurementId: "G-Y9694RE0JX"
    };

    firebase.initializeApp(firebaseConfig);
    var db = firebase.database();

    // ================================================================
    // HAYVANLAR
    // ================================================================
    var ANIMALS = [
        { name: "Fare", emoji: "🐭", power: 2 },
        { name: "Sincap", emoji: "🐿️", power: 3 },
        { name: "Tavsan", emoji: "🐇", power: 4 },
        { name: "Kopek", emoji: "🐕", power: 5 },
        { name: "Kurt", emoji: "🐺", power: 7 },
        { name: "Leopar", emoji: "🐆", power: 8 },
        { name: "Kaplan", emoji: "🐅", power: 9 },
        { name: "Aslan", emoji: "🦁", power: 10 },
        { name: "Ayi", emoji: "🐻", power: 10 },
        { name: "Goril", emoji: "🦍", power: 11 },
        { name: "Fil", emoji: "🐘", power: 12 },
        { name: "Su Aygyr", emoji: "🦛", power: 13 },
        { name: "Gergedan", emoji: "🦏", power: 14 },
        { name: "Timsah", emoji: "🐊", power: 15 },
        { name: "Kartal", emoji: "🦅", power: 16 },
        { name: "Ejderha", emoji: "🐉", power: 20 },
        { name: "Dinozor", emoji: "🦕", power: 22 },
        { name: "Mamut", emoji: "🦣", power: 24 },
        { name: "Dev Ahtapot", emoji: "🐙", power: 26 },
        { name: "Deniz Canavari", emoji: "🐲", power: 30 }
    ];

    function randomAnimal() {
        var index = Math.floor(Math.random() * ANIMALS.length);
        return ANIMALS[index];
    }

    // ================================================================
    // OYUN DURUMU
    // ================================================================
    var myId = null;
    var myRoom = null;
    var isHost = false;
    var gameStarted = false;
    var gameData = null;

    // ================================================================
    // DOM
    // ================================================================
    function $(id) {
        return document.getElementById(id);
    }

    var logEl = $('logArea');

    function log(msg) {
        console.log(msg);
        var d = document.createElement('div');
        d.textContent = msg;
        logEl.prepend(d);
        if (logEl.children.length > 30) {
            logEl.removeChild(logEl.lastChild);
        }
    }

    function generateCode() {
        var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        var code = '';
        for (var i = 0; i < 4; i = i + 1) {
            code = code + chars[Math.floor(Math.random() * 26)];
        }
        return code;
    }

    function arrayIncludes(arr, item) {
        if (!arr) return false;
        for (var i = 0; i < arr.length; i = i + 1) {
            if (arr[i] === item) return true;
        }
        return false;
    }

    // ================================================================
    // UI GUNCELLEME
    // ================================================================
    function updateUI(data) {
        if (!data) {
            console.warn('Veri yok!');
            return;
        }
        gameData = data;
        gameStarted = data.gameStarted || false;

        var players = data.players || {};
        var ids = Object.keys(players);
        var currentId = data.currentPlayerId || null;
        var animal = data.currentAnimal || null;
        var bid = data.highestBid || 0;
        var bidder = data.highestBidder || null;
        var phase = data.turnPhase || 'idle';
        var over = data.gameOver || false;
        var winner = data.winnerId || null;
        var spinnerId = data.spinnerId || null;
        var passCount = data.passCount || 0;
        var totalPlayers = ids.length;

        var listEl = $('playerList');
        var listHtml = '';
        for (var i = 0; i < ids.length; i = i + 1) {
            var id = ids[i];
            var p = players[id];
            var isMe = (id === myId);
            var passed = arrayIncludes(data.passedPlayers, id);
            var style = 'background:#1a2e1f;padding:2px 10px;border-radius:15px;margin:2px;display:inline-block;';
            if (passed) {
                style = style + 'opacity:0.4;';
            }
            listHtml = listHtml + '<span style="' + style + '">';
            listHtml = listHtml + (p ? p.name : id);
            if (p && p.isHost) listHtml = listHtml + ' ⭐';
            if (isMe) listHtml = listHtml + ' 👤';
            if (passed) listHtml = listHtml + ' ⛔';
            listHtml = listHtml + '</span>';
        }
        listEl.innerHTML = listHtml;
        $('playerCount').textContent = ids.length;

        var wMsg = $('waitingMsg');
        var setupBtns = document.querySelectorAll('.setup-btn');
        var resetBtn = $('resetBtn');

        if (!gameStarted && ids.length < 2) {
            wMsg.style.display = 'block';
            wMsg.textContent = '⏳ Oyuncu bekleniyor... (' + ids.length + '/2)';
            for (var j = 0; j < setupBtns.length; j = j + 1) {
                setupBtns[j].disabled = true;
            }
            resetBtn.disabled = true;
        } else if (!gameStarted && ids.length >= 2) {
            wMsg.style.display = 'none';
            for (var k = 0; k < setupBtns.length; k = k + 1) {
                setupBtns[k].disabled = !isHost;
            }
            resetBtn.disabled = !isHost;
            if (isHost) {
                log('✅ ' + ids.length + ' oyuncu hazir! "2 Kisi" butonuna tikla.');
            }
        } else {
            wMsg.style.display = 'none';
            for (var l = 0; l < setupBtns.length; l = l + 1) {
                setupBtns[l].disabled = true;
            }
            resetBtn.disabled = !isHost;
        }

        var isMyTurn = (currentId === myId);
        var myPlayer = players[myId];
        var finished = myPlayer ? myPlayer.finished : false;
        var hasPassed = arrayIncludes(data.passedPlayers, myId);
        var canBid = gameStarted && phase === 'bidding' && isMyTurn && !finished && animal && !over && !hasPassed;
        var canPass = gameStarted && phase === 'bidding' && isMyTurn && !finished && animal && !over && !hasPassed;
        var canSpin = gameStarted && (phase === 'idle' || phase === 'finished') && isMyTurn && !finished && !over;

        $('bidBtn').disabled = !canBid;
        $('passBtn').disabled = !canPass;
        $('spinBtn').disabled = !canSpin;

        if (animal) {
            $('animalEmoji').textContent = animal.emoji;
            $('animalName').textContent = animal.name;
            $('animalPower').textContent = animal.power;
        } else {
            $('animalEmoji').textContent = '❓';
            $('animalName').textContent = 'HAYVAN YOK';
            $('animalPower').textContent = '?';
        }

        var currentPlayer = players[currentId];
        $('turnIndicator').textContent = currentPlayer ? currentPlayer.name : '-';
        $('highestBid').textContent = bid + '$';
        var bidderPlayer = bidder !== null ? (players[bidder] ? players[bidder].name : '-') : '-';
        $('highestBidder').textContent = bidderPlayer;
        
        var spinnerPlayer = spinnerId ? (players[spinnerId] ? players[spinnerId].name : '-') : '-';
        $('spinnerInfo').textContent = spinnerPlayer;
        $('passInfo').textContent = passCount + '/' + totalPlayers;

        var forcedWarning = $('forcedWarning');
        if (phase === 'finished' && animal && passCount >= totalPlayers) {
            forcedWarning.style.display = 'block';
        } else {
            forcedWarning.style.display = 'none';
        }

        if (over && winner) {
            var w = players[winner];
            $('winnerBanner').style.display = 'block';
            var winnerName = w ? w.name : '?';
            var winnerPower = w ? w.totalPower : 0;
            $('winnerBanner').innerHTML = '🏆 KAZANAN: ' + winnerName + ' (⚡' + winnerPower + ') 🏆';
        } else {
            $('winnerBanner').style.display = 'none';
        }

        var cardsEl = $('playerCards');
        cardsEl.innerHTML = '';
        if (ids.length === 0) {
            cardsEl.innerHTML = '<div style="text-align:center;padding:20px;color:#888;">Henuz oyuncu yok</div>';
            return;
        }
        for (var m = 0; m < ids.length; m = m + 1) {
            var pid = ids[m];
            var p = players[pid];
            if (!p) continue;
            var card = document.createElement('div');
            card.className = 'player-card';
            if (pid === currentId && !over) card.classList.add('active');
            if (p.finished) card.classList.add('finished');
            if (pid === myId) card.classList.add('you');
            
            var passed2 = arrayIncludes(data.passedPlayers, pid);
            if (passed2) card.style.opacity = '0.4';

            var crew = p.crew || [];
            var crewHtml = '';
            if (crew.length > 0) {
                for (var n = 0; n < crew.length; n = n + 1) {
                    crewHtml = crewHtml + '<span>' + crew[n].emoji + crew[n].name + '(' + crew[n].power + ')</span> ';
                }
            } else {
                crewHtml = '<span style="opacity:0.4;">Bos</span>';
            }

            card.innerHTML = 
                '<div style="display:flex;justify-content:space-between;flex-wrap:wrap;">' +
                    '<span class="player-name">' + p.name + (passed2 ? ' ⛔' : '') + '</span>' +
                    '<span class="player-budget">💰' + (p.budget || 0) + '$</span>' +
                '</div>' +
                '<div style="font-size:0.7rem;margin-top:3px;">' +
                    'Kadro (' + crew.length + '/5) ⚡' + (p.totalPower || 0) +
                    (pid === myId ? ' <span class="status-badge you">SEN</span>' : '') +
                    (p.isHost ? ' <span class="status-badge host">⭐</span>' : '') +
                '</div>' +
                '<div class="player-crew">' + crewHtml + '</div>';
            cardsEl.appendChild(card);
        }
    }

    // ================================================================
    // FIREBASE ISLEMLERI
    // ================================================================
    function getRoomRef() {
        return db.ref('rooms/' + myRoom);
    }

    function createRoom() {
        console.log('Oda olusturuluyor...');
        var code = generateCode();
        myRoom = code;
        isHost = true;
        myId = 'p_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
        $('roomDisplay').textContent = code;
        $('roomInput').value = code;

        var roomRef = db.ref('rooms/' + code);
        var playerData = {};
        playerData[myId] = {
            name: 'Oyuncu 1',
            budget: 15,
            crew: [],
            totalPower: 0,
            finished: false,
            isHost: true
        };
        roomRef.set({
            players: playerData,
            currentPlayerId: myId,
            currentAnimal: null,
            spinnerId: null,
            highestBid: 0,
            highestBidder: null,
            turnPhase: 'idle',
            gameOver: false,
            winnerId: null,
            gameStarted: false,
            playerCount: 1,
            passCount: 0,
            passedPlayers: []
        });

        log('✅ Oda olusturuldu! Kod: ' + code);
        log('📋 Arkadaslarina bu kodu ver.');
        $('syncStatus').textContent = '✅ Oda hazir';
        listenRoom(code);
    }

    function joinRoom() {
        console.log('Odaya katilinior...');
        var code = $('roomInput').value.toUpperCase().trim();
        if (!code || code.length !== 4) {
            log('❌ 4 harfli kod girin!');
            return;
        }
        myRoom = code;
        myId = 'p_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
        $('roomDisplay').textContent = code;

        var roomRef = db.ref('rooms/' + code);
        roomRef.once('value', function(snap) {
            var data = snap.val();
            if (!data) {
                log('❌ Oda bulunamadi!');
                return;
            }
            var players = data.players || {};
            var count = Object.keys(players).length;
            if (count >= 4) {
                log('❌ Oda dolu! (Maks 4 kisi)');
                return;
            }
            if (players[myId]) {
                log('ℹ️ Zaten bu odadasin!');
                listenRoom(code);
                return;
            }

            var updates = {};
            var newPlayerKey = 'players/' + myId;
            updates[newPlayerKey] = {
                name: 'Oyuncu ' + (count + 1),
                budget: 15,
                crew: [],
                totalPower: 0,
                finished: false,
                isHost: false
            };
            updates['playerCount'] = count + 1;

            roomRef.update(updates, function(error) {
                if (error) {
                    log('❌ Hata: ' + error);
                } else {
                    log('✅ Odaya katildin! (' + (count + 1) + '/4)');
                    $('syncStatus').textContent = '✅ Baglandi';
                    listenRoom(code);
                }
            });
        });
    }

    function listenRoom(code) {
        var roomRef = db.ref('rooms/' + code);
        roomRef.on('value', function(snap) {
            var data = snap.val();
            if (!data) {
                log('❌ Oda silinmis veya bulunamadi.');
                return;
            }
            gameStarted = data.gameStarted || false;
            if (data.players && data.players[myId]) {
                isHost = data.players[myId].isHost || false;
            }
            updateUI(data);
            $('syncStatus').textContent = '✅ Gercek zamanli';
        });
    }

    // ================================================================
    // OYUN BASLAT
    // ================================================================
    function startGame(count) {
        if (!isHost) {
            log('⚠️ Sadece ev sahibi baslatabilir!');
            return;
        }
        var roomRef = getRoomRef();
        roomRef.once('value', function(snap) {
            var data = snap.val();
            if (!data) return;
            var players = data.players || {};
            var ids = Object.keys(players);
            if (ids.length < 2) {
                log('❌ En az 2 oyuncu gerekli!');
                return;
            }

            var names = ['🦊 Aslan', '🐺 Kurt', '🦅 Sahin', '🐉 Ejder'];
            var updates = {};
            for (var i = 0; i < ids.length; i = i + 1) {
                var id = ids[i];
                updates['players/' + id + '/name'] = names[i % names.length] + (i + 1);
                if (players[id] && players[id].budget !== undefined && players[id].budget !== null) {
                    updates['players/' + id + '/budget'] = players[id].budget;
                } else {
                    updates['players/' + id + '/budget'] = 15;
                }
                updates['players/' + id + '/crew'] = [];
                updates['players/' + id + '/totalPower'] = 0;
                updates['players/' + id + '/finished'] = false;
            }
            updates['gameStarted'] = true;
            updates['gameOver'] = false;
            updates['winnerId'] = null;
            updates['currentPlayerId'] = ids[0];
            updates['currentAnimal'] = null;
            updates['spinnerId'] = null;
            updates['highestBid'] = 0;
            updates['highestBidder'] = null;
            updates['turnPhase'] = 'idle';
            updates['passCount'] = 0;
            updates['passedPlayers'] = [];

            roomRef.update(updates);
            log('🎮 Oyun basladi! ' + ids.length + ' kisi.');
            log('🔄 "Carki Cevir" ile hayvan getirin!');
        });
    }

    // ================================================================
    // CARKI CEVIR
    // ================================================================
    function spinAnimal() {
        if (!gameStarted) {
            log('⚠️ Oyun baslamadi!');
            return;
        }
        var roomRef = getRoomRef();
        roomRef.once('value', function(snap) {
            var data = snap.val();
            if (!data || data.gameOver) return;
            if (data.turnPhase !== 'idle' && data.turnPhase !== 'finished') {
                log('⚠️ Once bu hayvani sonuclandirin!');
                return;
            }
            if (data.currentPlayerId !== myId) {
                log('⏳ Sira sende degil!');
                return;
            }
            if (data.players[myId] && data.players[myId].finished) {
                log('❌ Kadron dolu! Sira geciyor...');
                var ids = Object.keys(data.players);
                var idx = ids.indexOf(myId);
                var nextId = null;
                for (var i = 1; i <= ids.length; i = i + 1) {
                    var ni = ids[(idx + i) % ids.length];
                    if (!data.players[ni] || !data.players[ni].finished) {
                        nextId = ni;
                        break;
                    }
                }
                if (nextId) roomRef.update({ currentPlayerId: nextId });
                return;
            }

            var animal = randomAnimal();
            var updates = {
                currentAnimal: animal,
                spinnerId: myId,
                highestBid: 0,
                highestBidder: null,
                turnPhase: 'bidding',
                passCount: 0,
                passedPlayers: []
            };
            roomRef.update(updates);
            var playerName = data.players[myId] ? data.players[myId].name : 'Oyuncu';
            log('🎲 ' + animal.emoji + ' ' + animal.name + ' (⚡' + animal.power + ') cikti!');
            log('💡 ' + playerName + ' 1$ teklif verebilir veya pas gecebilir.');
        });
    }

    // ================================================================
    // TEKLIF VER
    // ================================================================
    function placeBid() {
        if (!gameStarted) {
            log('⚠️ Oyun baslamadi!');
            return;
        }
        var roomRef = getRoomRef();
        roomRef.once('value', function(snap) {
            var data = snap.val();
            if (!data || data.gameOver || data.turnPhase !== 'bidding' || !data.currentAnimal) {
                log('⚠️ Teklif verilemez!');
                return;
            }
            if (data.currentPlayerId !== myId) {
                log('⏳ Sira sende degil!');
                return;
            }
            var player = data.players[myId];
            if (!player || player.finished) return;
            
            if (arrayIncludes(data.passedPlayers, myId)) {
                log('⛔ Zaten pas gectin!');
                return;
            }
            
            if (player.budget < 1) {
                log('❌ Butcen yok! Otomatik pas geciyorsun.');
                var updates2 = {};
                var passedPlayers2 = data.passedPlayers || [];
                if (!arrayIncludes(passedPlayers2, myId)) {
                    passedPlayers2.push(myId);
                    updates2.passedPlayers = passedPlayers2;
                    updates2.passCount = (data.passCount || 0) + 1;
                    log(player.name + ' ⛔ otomatik pas gecti (butce yok).');
                }
                var ids2 = Object.keys(data.players);
                var idx2 = ids2.indexOf(myId);
                var nextId2 = null;
                for (var k2 = 1; k2 <= ids2.length; k2 = k2 + 1) {
                    var ni2 = ids2[(idx2 + k2) % ids2.length];
                    if (!data.players[ni2] || (!data.players[ni2].finished && !arrayIncludes(passedPlayers2, ni2))) {
                        nextId2 = ni2;
                        break;
                    }
                }
                if (nextId2) updates2.currentPlayerId = nextId2;
                roomRef.update(updates2);
                return;
            }

            var currentHighestBid = data.highestBid || 0;
            var newBid = currentHighestBid + 1;
            
            if (newBid > player.budget) {
                log('❌ Butcen ' + player.budget + '$, ' + newBid + '$ yetmiyor!');
                return;
            }

            var updates3 = {
                highestBid: newBid,
                highestBidder: myId
            };

            var ids3 = Object.keys(data.players);
            var passedPlayers3 = data.passedPlayers || [];
            var idx3 = ids3.indexOf(myId);
            var nextId3 = null;
            for (var k3 = 1; k3 <= ids3.length; k3 = k3 + 1) {
                var ni3 = ids3[(idx3 + k3) % ids3.length];
                if (!data.players[ni3] || (!data.players[ni3].finished && !arrayIncludes(passedPlayers3, ni3) && ni3 !== myId)) {
                    nextId3 = ni3;
                    break;
                }
            }
            
            if (nextId3) {
                updates3.currentPlayerId = nextId3;
                log(player.name + ' ➡️ ' + newBid + '$ verdi. Sira ' + data.players[nextId3].name + '\'de.');
            } else {
                log(player.name + ' ➡️ ' + newBid + '$ verdi!');
            }

            roomRef.update(updates3);
        });
    }

    // ================================================================
    // ⭐ PAS GEÇ + BÜTÇE DÜŞÜŞÜ (HEM ZORUNLU HEM NORMAL ALIM)
    // ================================================================
    function handlePass() {
        if (!gameStarted) {
            log('⚠️ Oyun baslamadi!');
            return;
        }
        var roomRef = getRoomRef();
        roomRef.once('value', function(snap) {
            var data = snap.val();
            if (!data || data.gameOver || data.turnPhase !== 'bidding' || !data.currentAnimal) {
                log('⚠️ Pas gecilemez!');
                return;
            }
            if (data.currentPlayerId !== myId) {
                log('⏳ Sira sende degil!');
                return;
            }
            var player = data.players[myId];
            if (!player || player.finished) return;
            
            if (arrayIncludes(data.passedPlayers, myId)) {
                log('⛔ Zaten pas gectin!');
                return;
            }

            var updates4 = {};
            var passedPlayers4 = data.passedPlayers || [];
            passedPlayers4.push(myId);
            updates4.passedPlayers = passedPlayers4;
            
            var passCount4 = (data.passCount || 0) + 1;
            updates4.passCount = passCount4;
            
            if (data.highestBidder === myId) {
                updates4.highestBid = 0;
                updates4.highestBidder = null;
                log(player.name + ' en yuksek tekliften vazgecti!');
            }
            
            log(player.name + ' ⛔ pas gecti.');

            var totalPlayers4 = Object.keys(data.players).length;
            
            // ⭐ HERKES PAS GEÇTİ Mİ? ZORUNLU ALIM!
            if (passCount4 >= totalPlayers4) {
                var spinnerId4 = data.spinnerId;
                var spinner4 = data.players[spinnerId4];
                var animal4 = data.currentAnimal;
                
                if (spinner4 && spinner4.budget >= 1 && !spinner4.finished) {
                    var oldBudget = spinner4.budget;
                    spinner4.budget = spinner4.budget - 1;
                    spinner4.crew = spinner4.crew || [];
                    var newAnimal = {
                        name: animal4.name,
                        emoji: animal4.emoji,
                        power: animal4.power
                    };
                    spinner4.crew.push(newAnimal);
                    spinner4.totalPower = (spinner4.totalPower || 0) + animal4.power;
                    if (spinner4.crew.length >= 5) spinner4.finished = true;
                    
                    updates4['players/' + spinnerId4] = spinner4;
                    updates4.currentAnimal = null;
                    updates4.turnPhase = 'finished';
                    updates4.passCount = 0;
                    updates4.passedPlayers = [];
                    
                    log('🚨 ZORUNLU ALIM! ' + spinner4.name + ' ' + animal4.emoji + ' ' + animal4.name + ' 1$ odeyerek aldi!');
                    log('💰 Eski bütçe: ' + oldBudget + ' -> Yeni bütçe: ' + spinner4.budget);
                    log('📦 ' + spinner4.name + ' kadrosu: ' + spinner4.crew.length + '/5');
                    
                    var ids4 = Object.keys(data.players);
                    var idx4 = ids4.indexOf(spinnerId4);
                    var nextId4 = null;
                    for (var k4 = 1; k4 <= ids4.length; k4 = k4 + 1) {
                        var ni4 = ids4[(idx4 + k4) % ids4.length];
                        if (!data.players[ni4] || !data.players[ni4].finished) {
                            nextId4 = ni4;
                            break;
                        }
                    }
                    if (nextId4) updates4.currentPlayerId = nextId4;
                    
                    roomRef.update(updates4);
                    setTimeout(function() { checkGameOver(roomRef); }, 300);
                    return;
                } else {
                    var spinnerName = spinner4 ? spinner4.name : 'Ceviren kisi';
                    log('⚠️ ' + spinnerName + ' 1$ butcesi yok veya kadrosu dolu! Hayvan elden gitti.');
                    updates4.currentAnimal = null;
                    updates4.turnPhase = 'finished';
                    updates4.passCount = 0;
                    updates4.passedPlayers = [];
                    
                    var ids5 = Object.keys(data.players);
                    var idx5 = ids5.indexOf(myId);
                    var nextId5 = null;
                    for (var k5 = 1; k5 <= ids5.length; k5 = k5 + 1) {
                        var ni5 = ids5[(idx5 + k5) % ids5.length];
                        if (!data.players[ni5] || !data.players[ni5].finished) {
                            nextId5 = ni5;
                            break;
                        }
                    }
                    if (nextId5) updates4.currentPlayerId = nextId5;
                    
                    roomRef.update(updates4);
                    setTimeout(function() { checkGameOver(roomRef); }, 300);
                    return;
                }
            }

            // ⭐ NORMAL ALIM: En yüksek teklif veren varsa O ALIR!
            var highestBidderId = data.highestBidder;
            var highestBid = data.highestBid || 0;
            
            if (highestBidderId && highestBid > 0) {
                var winner2 = data.players[highestBidderId];
                var animal2 = data.currentAnimal;
                
                if (winner2 && !winner2.finished && winner2.budget >= highestBid) {
                    var oldBudget2 = winner2.budget;
                    winner2.budget = winner2.budget - highestBid;
                    winner2.crew = winner2.crew || [];
                    var newAnimal2 = {
                        name: animal2.name,
                        emoji: animal2.emoji,
                        power: animal2.power
                    };
                    winner2.crew.push(newAnimal2);
                    winner2.totalPower = (winner2.totalPower || 0) + animal2.power;
                    if (winner2.crew.length >= 5) winner2.finished = true;
                    
                    updates4['players/' + highestBidderId] = winner2;
                    updates4.currentAnimal = null;
                    updates4.turnPhase = 'finished';
                    updates4.passCount = 0;
                    updates4.passedPlayers = [];
                    updates4.highestBid = 0;
                    updates4.highestBidder = null;
                    
                    var ids8 = Object.keys(data.players);
                    var idx8 = ids8.indexOf(highestBidderId);
                    var nextId8 = null;
                    for (var k8 = 1; k8 <= ids8.length; k8 = k8 + 1) {
                        var ni8 = ids8[(idx8 + k8) % ids8.length];
                        if (!data.players[ni8] || !data.players[ni8].finished) {
                            nextId8 = ni8;
                            break;
                        }
                    }
                    if (nextId8) updates4.currentPlayerId = nextId8;
                    
                    roomRef.update(updates4);
                    log('🏅 ' + winner2.name + ' ' + animal2.emoji + ' ' + animal2.name + ' ' + highestBid + '$ odeyerek kazandi!');
                    log('💰 Eski bütçe: ' + oldBudget2 + ' -> Yeni bütçe: ' + winner2.budget);
                    log('📦 ' + winner2.name + ' kadrosu: ' + winner2.crew.length + '/5');
                    
                    setTimeout(function() { checkGameOver(roomRef); }, 300);
                    return;
                }
            }

            // Sırayı bir sonraki oyuncuya ver
            var ids6 = Object.keys(data.players);
            var idx6 = ids6.indexOf(myId);
            var nextId6 = null;
            for (var k6 = 1; k6 <= ids6.length; k6 = k6 + 1) {
                var ni6 = ids6[(idx6 + k6) % ids6.length];
                if (!data.players[ni6] || (!data.players[ni6].finished && !arrayIncludes(passedPlayers4, ni6))) {
                    nextId6 = ni6;
                    break;
                }
            }
            
            if (data.highestBidder && data.players[data.highestBidder] && 
                !data.players[data.highestBidder].finished && 
                !arrayIncludes(passedPlayers4, data.highestBidder)) {
                nextId6 = data.highestBidder;
            }

            if (nextId6) {
                updates4.currentPlayerId = nextId6;
                log('⏳ Sira ' + data.players[nextId6].name + '\'de.');
            } else {
                // Hiç aktif oyuncu kalmadıysa spinner zorunlu alır
                var spinnerId6 = data.spinnerId;
                var spinner6 = data.players[spinnerId6];
                var animal6 = data.currentAnimal;
                
                if (spinner6 && spinner6.budget >= 1 && !spinner6.finished) {
                    var oldBudget3 = spinner6.budget;
                    spinner6.budget = spinner6.budget - 1;
                    spinner6.crew = spinner6.crew || [];
                    var newAnimal6 = {
                        name: animal6.name,
                        emoji: animal6.emoji,
                        power: animal6.power
                    };
                    spinner6.crew.push(newAnimal6);
                    spinner6.totalPower = (spinner6.totalPower || 0) + animal6.power;
                    if (spinner6.crew.length >= 5) spinner6.finished = true;
                    
                    updates4['players/' + spinnerId6] = spinner6;
                    updates4.currentAnimal = null;
                    updates4.turnPhase = 'finished';
                    updates4.passCount = 0;
                    updates4.passedPlayers = [];
                    
                    log('🚨 ZORUNLU ALIM! ' + spinner6.name + ' ' + animal6.emoji + ' ' + animal6.name + ' 1$ odeyerek aldi!');
                    log('💰 Eski bütçe: ' + oldBudget3 + ' -> Yeni bütçe: ' + spinner6.budget);
                    
                    var ids7 = Object.keys(data.players);
                    var idx7 = ids7.indexOf(spinnerId6);
                    var nextId7 = null;
                    for (var k7 = 1; k7 <= ids7.length; k7 = k7 + 1) {
                        var ni7 = ids7[(idx7 + k7) % ids7.length];
                        if (!data.players[ni7] || !data.players[ni7].finished) {
                            nextId7 = ni7;
                            break;
                        }
                    }
                    if (nextId7) updates4.currentPlayerId = nextId7;
                    
                    roomRef.update(updates4);
                    setTimeout(function() { checkGameOver(roomRef); }, 300);
                    return;
                } else {
                    log('⚠️ Hayvan elden gitti!');
                    updates4.currentAnimal = null;
                    updates4.turnPhase = 'finished';
                    updates4.passCount = 0;
                    updates4.passedPlayers = [];
                    roomRef.update(updates4);
                    setTimeout(function() { checkGameOver(roomRef); }, 300);
                    return;
                }
            }
            
            roomRef.update(updates4);
        });
    }

    // ================================================================
    // OYUN BİTTİ Mİ KONTROL ET
    // ================================================================
    function checkGameOver(roomRef) {
        roomRef.once('value', function(snap) {
            var data = snap.val();
            if (!data) return;
            
            var players = data.players || {};
            var ids = Object.keys(players);
            
            var allDone = true;
            var allFull = true;
            for (var i = 0; i < ids.length; i = i + 1) {
                var id = ids[i];
                var p = players[id];
                if (!p.finished && p.budget >= 1) allDone = false;
                if ((p.crew || []).length < 5) allFull = false;
            }
            
            if (allDone || allFull) {
                var maxP = -1;
                var winId = null;
                for (var j = 0; j < ids.length; j = j + 1) {
                    var pId = ids[j];
                    var p = players[pId];
                    var total = 0;
                    var crew = p.crew || [];
                    for (var c = 0; c < crew.length; c = c + 1) {
                        total = total + crew[c].power;
                    }
                    if (total > maxP) {
                        maxP = total;
                        winId = pId;
                    }
                }
                roomRef.update({
                    gameOver: true,
                    winnerId: winId,
                    turnPhase: 'finished'
                });
                var winnerName = winId ? (players[winId] ? players[winId].name : '?') : '?';
                log('🏆 OYUN BITTI! Kazanan: ' + winnerName + ' (⚡' + maxP + ')');
            }
        });
    }

    function resetGame() {
        if (!isHost) {
            log('⚠️ Sadece ev sahibi sifirlayabilir!');
            return;
        }
        var roomRef = getRoomRef();
        roomRef.once('value', function(snap) {
            var data = snap.val();
            if (!data) return;
            var updates9 = {};
            var players = data.players || {};
            var ids = Object.keys(players);
            for (var i = 0; i < ids.length; i = i + 1) {
                var id = ids[i];
                updates9['players/' + id + '/budget'] = 15;
                updates9['players/' + id + '/crew'] = [];
                updates9['players/' + id + '/totalPower'] = 0;
                updates9['players/' + id + '/finished'] = false;
            }
            updates9.gameOver = false;
            updates9.winnerId = null;
            updates9.currentAnimal = null;
            updates9.spinnerId = null;
            updates9.highestBid = 0;
            updates9.highestBidder = null;
            updates9.turnPhase = 'idle';
            updates9.gameStarted = true;
            updates9.passCount = 0;
            updates9.passedPlayers = [];
            updates9.currentPlayerId = ids[0] || null;
            roomRef.update(updates9);
            log('🔄 Oyun sifirlandi!');
        });
    }

    // ================================================================
    // EVENTLER
    // ================================================================
    $('createBtn').addEventListener('click', createRoom);
    $('joinBtn').addEventListener('click', joinRoom);

    $('copyBtn').addEventListener('click', function() {
        var code = $('roomDisplay').textContent;
        if (code && code !== '-----') {
            navigator.clipboard.writeText(code).then(function() {
                log('📋 Oda kodu kopyalandi!');
            });
        }
    });

    $('roomInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') joinRoom();
    });

    var setupBtns = document.querySelectorAll('.setup-btn');
    for (var i = 0; i < setupBtns.length; i = i + 1) {
        var btn = setupBtns[i];
        btn.addEventListener('click', function() {
            var btns = document.querySelectorAll('.setup-btn');
            for (var j = 0; j < btns.length; j = j + 1) {
                btns[j].classList.remove('active');
            }
            this.classList.add('active');
            startGame(parseInt(this.dataset.player));
        });
    }

    $('resetBtn').addEventListener('click', resetGame);
    $('spinBtn').addEventListener('click', spinAnimal);
    $('bidBtn').addEventListener('click', placeBid);
    $('passBtn').addEventListener('click', handlePass);

    // ================================================================
    // BASLANGIC
    // ================================================================
    log('🎮 Firebase ile gercek zamanli oyuna hos geldin!');
    log('📋 Oda olustur veya mevcut bir odaya katil.');
    $('syncStatus').textContent = '✅ Baglanti hazir';
    console.log('✅ Oyun baslatildi!');
</script>
